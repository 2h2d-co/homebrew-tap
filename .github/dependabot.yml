version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Dependabot measures action cooldowns from the tagged commit's date. Homebrew/actions tags
    # its weekly release about three days after that commit, so 10 days keeps proposals at least
    # 7 days after each release.
    cooldown:
      default-days: 10
    commit-message:
      prefix: ci
      include: scope
