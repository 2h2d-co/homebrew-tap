[settings]
lockfile = true
locked = true
minimum_release_age = "7d"
ruby.compile = false

[tools]
hk = { version = "2.0.1", postinstall = "hk install --mise" }
betterleaks = "1.8.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
zizmor = "1.29.0"
ruby = "4.0.6"

[tasks.check]
description = "Run local hygiene and formula style checks; CI audits the installed tap"
run = [
  "hk check --all --check",
  "HOMEBREW_NO_AUTO_UPDATE=1 brew style Formula/*.rb",
]
