[settings]
lockfile = true
lockfile_mode = "generate"
locked = true
minimum_release_age = "7d"
ruby.compile = false

[tools]
hk = { version = "2.13.0", workflow = "release.yml", postinstall = "hk install --mise" }
betterleaks = "1.10.1"
cocogitto = "7.0.0"
jactionlint = "2.6.0"
zizmor = "1.32.0"
ruby = "4.0.9"

[tasks.check]
description = "Run local hygiene and formula style checks; CI audits the installed tap"
run = [
  "hk check --all --check",
  "HOMEBREW_NO_AUTO_UPDATE=1 brew style Formula/*.rb",
]
